services:
  telepi:
    build:
      context: .
      args:
        USER_UID: "${HOST_UID:-1000}"
        USER_GID: "${HOST_GID:-1000}"
    env_file: .env
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # pi agent config (auth, settings) - read-only
      - ${HOME}/.pi/agent/auth.json:/home/telepi/.pi/agent/auth.json:ro
      - ${HOME}/.pi/agent/settings.json:/home/telepi/.pi/agent/settings.json:ro
      # sessions - read-write (bot appends to session files)
      - ${HOME}/.pi/agent/sessions:/home/telepi/.pi/agent/sessions:rw
      # workspace - read-write, scoped working directory for the agent
      - ${TELEPI_WORKSPACE:-./workspace}:/workspace:rw
      # npm global prefix persisted across restarts (for pi extensions)
      - npm-global:/home/telepi/.npm-global
      # ssh agent socket forwarding for git push (key never enters container)
      - ${SSH_AUTH_SOCK}:/ssh-agent:ro
      # git identity
      - ${HOME}/.gitconfig:/home/telepi/.gitconfig:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      # bot sets up polling; if the process is alive the bot is running
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  npm-global:
